<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - IDEA Furniture</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/shop.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="../index.html">
                <img src="../images/logo.png" alt="Idea Logo" height="50">
            </a>
            <div class="nav-buttons">
                <a class="nav-link" href="shop.html">SHOP</a>
                <a class="nav-link btn btn-warning text-dark" href="#">Login</a>
                <a class="nav-link btn btn-warning text-dark" href="cart.html">Cart</a>
            </div>
        </div>
    </nav>

    <section class="hero-section text-center py-5">
        <div class="container">
            <h1>Shop</h1>
        </div>
    </section>

    <section class="py-5">
        <div class="container">
            <div class="row row-cols-3 g-4" id="products-container">
            </div>
        </div>
    </section>

    <footer class="bg-primary text-white py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <h5>About IDEA</h5>
                    <p class="small">We are a global home furnishing brand that brings design and confort to people all over the world.</p>
                </div>
                <div class="col-md-2">
                    <h5>Contact</h5>
                    <p class="small">email@ideafurniture.com</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'http://localhost:8080/products';
        
        fetch(API_URL)
            .then(response => response.json())
            .then(products => {
                const container = document.getElementById('products-container');
                products.forEach(product => {
                    const col = document.createElement('div');
                    col.className = 'col';
                    col.innerHTML = `
                        <a href="product.html?id=${product.id}" class="product-link">
                            <img src="${product.imgUrl}" alt="${product.name}" class="product-img">
                            <p class="product-name">${product.name}</p>
                        </a>
                    `;
                    container.appendChild(col);
                });
            });
    </script>
</body>
</html>
